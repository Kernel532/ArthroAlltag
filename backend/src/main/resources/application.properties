spring.application.name=backend

# Der Default-Wert ist nur fuer die lokale Entwicklung - im Produktivbetrieb JWT_SECRET setzen
# (mind. 32 Zeichen, sonst lehnt jjwt den HS256-Schluessel ab).
app.jwt.secret=${JWT_SECRET:ThisIsADevOnlySecretKeyForTherapieManagementJWT1234567890}
# Gueltigkeitsdauer eines Tokens; danach ist ein neuer Login noetig.
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
# Komma-getrennte Liste erlaubter Frontend-Origins fuer CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Persistente H2-Datei-DB (./data/therapiedb.mv.db). Pfad per Umgebungsvariable DB_PATH
# ueberschreibbar. AUTO_SERVER=TRUE erlaubt der H2-Console, parallel zur laufenden App
# auf dieselbe Datei zuzugreifen.
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/therapiedb};AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# update ergaenzt fehlendes Schema, loescht aber keine Daten (create-drop wuerde bei jedem
# Neustart alles verwerfen). Fuer echte Schema-Versionierung waeren Migrationen (Flyway) der
# naechste Schritt.
spring.jpa.hibernate.ddl-auto=update

# Startdaten aus data.sql werden vom DatabaseSeeder nur bei leerer DB geladen, nicht von Spring.
spring.sql.init.mode=never
# Die H2-Console ist ein DB-Admin-Tool ohne Token-Schutz - nur lokal aktivieren (H2_CONSOLE_ENABLED=true).
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
