spring.application.name=backend

app.jwt.secret=ThisIsADevOnlySecretKeyForTherapieManagementJWT1234567890
app.jwt.expiration-minutes=60
app.cors.allowed-origins=http://localhost:4200

# Tests laufen gegen eine fluechtige In-Memory-DB, die bei jedem Lauf frisch aus data.sql
# aufgebaut wird - unabhaengig von der persistenten Datei-DB der echten Anwendung.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
