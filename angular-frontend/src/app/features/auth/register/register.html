<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 py-8">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-md p-6 sm:p-8">
    <h1 class="text-2xl font-semibold text-slate-900 mb-6 text-center">Profil anlegen</h1>

    <form (submit)="$event.preventDefault(); onSubmit()" class="space-y-5">
      <div>
        <label for="vorname" class="block text-base font-medium text-slate-700 mb-1">Vorname</label>
        <input
          id="vorname"
          type="text"
          autocomplete="given-name"
          [value]="vorname()"
          (input)="onInput('vorname', $event)"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label for="nachname" class="block text-base font-medium text-slate-700 mb-1">Nachname</label>
        <input
          id="nachname"
          type="text"
          autocomplete="family-name"
          [value]="nachname()"
          (input)="onInput('nachname', $event)"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label for="username" class="block text-base font-medium text-slate-700 mb-1">Benutzername</label>
        <input
          id="username"
          type="text"
          autocomplete="username"
          maxlength="10"
          aria-describedby="username-hint"
          [value]="username()"
          (input)="onInput('username', $event)"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <p id="username-hint" class="text-sm text-slate-500 mt-1">3-10 Zeichen: Buchstaben, Ziffern, _</p>
      </div>

      <div>
        <label for="password" class="block text-base font-medium text-slate-700 mb-1">Passwort</label>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          aria-describedby="password-hint"
          [value]="password()"
          (input)="onInput('password', $event)"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <p id="password-hint" class="text-sm text-slate-500 mt-1">Mindestens 6 Zeichen</p>
      </div>

      <app-error-message [message]="errorMessage()" />

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full rounded-lg bg-blue-600 text-white text-lg font-medium py-3 hover:bg-blue-700 disabled:opacity-50 transition-colors"
      >
        {{ isLoading() ? 'Wird angelegt ...' : 'Profil anlegen' }}
      </button>
    </form>

    <p class="mt-6 text-center text-base text-slate-600">
      Schon ein Profil?
      <a routerLink="/login" class="text-blue-700 font-medium underline">Zur Anmeldung</a>
    </p>
  </div>
</div>
