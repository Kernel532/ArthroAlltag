<div class="inline-flex items-center" role="group" [attr.aria-label]="label()">
  @for (star of stars; track star) {
    @if (readonly()) {
      <span [class]="star <= value() ? 'text-amber-400' : 'text-slate-300'" class="text-xl leading-none" aria-hidden="true">&#9733;</span>
    } @else {
      <button
        type="button"
        (click)="rated.emit(star)"
        [attr.aria-label]="star + (star === 1 ? ' Stern' : ' Sterne')"
        [attr.aria-pressed]="star <= value()"
        [class]="star <= value() ? 'text-amber-400' : 'text-slate-300'"
        class="text-3xl leading-none px-1 py-1 hover:text-amber-500 transition-colors"
      >
        &#9733;
      </button>
    }
  }
</div>
