<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
  <p class="text-slate-900 font-medium">
    {{ progress().abgeschlossen }} von {{ progress().gesamt }} abgeschlossen ({{ percent(progress()) }}&nbsp;%)
  </p>
  <div
    class="h-3 bg-slate-100 rounded-full mt-2 overflow-hidden"
    role="progressbar"
    aria-label="Gesamtfortschritt"
    [attr.aria-valuenow]="percent(progress())"
    aria-valuemin="0"
    aria-valuemax="100"
  >
    <div class="h-full bg-blue-600" [style.width.%]="percent(progress())"></div>
  </div>
  <ul class="mt-4 space-y-2">
    @for (kategorie of progress().kategorien; track kategorie.kategorie) {
      <li class="flex justify-between text-sm text-slate-600">
        <span>{{ kategorie.kategorie }}</span>
        <span>{{ kategorie.abgeschlossen }} / {{ kategorie.gesamt }}</span>
      </li>
    }
  </ul>
</div>
